[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Keep this dependency list small. xtask must compile before anything else can
# build, so its own build time is a floor on every other command.
[dependencies]
toml = "=0.9.8"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
