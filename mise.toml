# The one declaration of every build tool.
#
# mise installs each tool from this file. `mise.lock` holds the SHA-256 of every
# download for every platform, so an install on Linux and an install on macOS get
# the same bytes. Regenerate that file after you change a version here:
#
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,macos-x64
#
# CAUTION: Keep every version exact. A range makes two machines build different
# artifacts. `cargo xtask verify-pins` fails on a range.

[tools]
# CAUTION: This version is not free to change. libghostty-vt-sys 0.2.1 pins
# Ghostty commit a887df42, which declares .minimum_zig_version = "0.15.2".
# Ghostty's requireZig compares major and minor for equality, so Zig 0.16.0 is
# rejected. Zig 0.16.0 also breaks on a changed std.Io.Dir.readFileAlloc
# signature. Zig 0.15.2 is the last patch of the 0.15 series.
zig = "0.15.2"

bun = "1.3.14"

# mise drives rustup here and sets RUSTUP_TOOLCHAIN for the child process. The
# six targets are the six release targets. This entry replaces rust-toolchain.toml.
rust = { version = "1.97.1", profile = "minimal", components = "rustfmt,clippy", targets = "aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" }

# The linker driver for the four Linux targets. The aqua backend takes the
# prebuilt binary from the GitHub release, so no machine compiles it.
"aqua:rust-cross/cargo-zigbuild" = "0.23.0"

# The license allowlist and the RustSec advisory database. See deny.toml.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
# The Zig cache reached 868 MB for six targets. This path holds the cache inside
# the repository. One `rm -rf .toolchain` frees it, and CI caches one directory.
# `cargo xtask verify-pins` fails when this line is absent.
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.toolchain/zig-cache"

[settings]
# Write mise.lock. mise reads the checksums of that file with or without this
# setting, and it refuses a download that does not match. This setting governs
# the write: without it mise records no new version and no new checksum.
lockfile = true
