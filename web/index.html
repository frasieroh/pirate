<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pirate</title>
  </head>
  <body>
    <div id="terminal"></div>
    <!-- The menu is fixed, in the top right corner. It is out of the layout
         flow, so it never changes the box of the terminal. `src/style.css`
         holds the reason. -->
    <div id="menu" data-state="open">
      <div id="menu-header">
        <span id="menu-status" role="status" data-state="ok"></span>
        <button id="menu-toggle" type="button" aria-label="collapse the menu">−</button>
      </div>
      <div id="menu-body"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
