name: ci

# CI holds four jobs, one per kind of check. Each job runs on its own, and no
# job needs another one to finish first:
#   lint    formatting, clippy, pin verification, and the web typecheck
#   e2e     the browser suite (stub server) and the end-to-end suite (real binary)
#   macos   the two Apple targets, plus the unit tests on the host target
#   linux   the four Linux targets, plus the unit tests on the host target
#
# The release workflow owns the release artifacts. No workflow builds the
# container image. A person builds that image from the Dockerfile.
#
# Two build jobs for the six targets, because the macOS SDK license does not
# permit redistribution:
#   macos   aarch64-apple-darwin, x86_64-apple-darwin            plain cargo build
#   linux   the two gnu.2.28 targets and the two musl targets    cargo zigbuild
# `cargo xtask build --target T` makes that choice. Do not repeat it here.
#
# mise.toml declares every tool version, and jdx/mise-action installs them.
# That action caches its own installs, so this file caches build output only:
#   1 ZIG_GLOBAL_CACHE_DIR              key: OS, mise.toml, Ghostty commit, Cargo.lock
#   2 the Ghostty source checkout       key: Ghostty commit (one entry for every job)
#   3 the Cargo registry                key: OS, Cargo.lock
#   4 the Cargo target directory        key: OS, Cargo.lock, mise.toml
#   5 web/node_modules                  key: OS, web/bun.lock
#   6 the Playwright browser            key: OS, web/bun.lock
#
# NOTE: A repository gets 10 GB of cache. Cache 1 holds the Zig global cache:
# the packages that the Ghostty build fetches, and the artifacts that Zig shares
# between builds. The build script of libghostty-vt-sys passes
# `--cache-dir <OUT_DIR>/zig-cache`, so the compile output of each target lands
# under `target/` and belongs to cache 4. Cache 4 is therefore the large one.
# Caches 1, 2, 3, 5, and 6 hold one Linux key each, so the lint, e2e, and linux
# jobs share one entry per cache and only one of them needs to write it. Cache
# 4 saves on `main` only, and the macos and linux jobs are its only writers, so
# a branch that changes Cargo.lock cannot fill the budget with copies.
#
# CAUTION: Do not add the `sha256:` input to jdx/mise-action. That checksum
# holds for one platform, and this workflow runs on ubuntu and on macOS.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Zig compile of libghostty-vt is the slowest step, and Debug is much
  # faster than ReleaseFast. ReleaseFast belongs to the release workflow only.
  LIBGHOSTTY_VT_SYS_OPTIMIZE: Debug
  CARGO_TERM_COLOR: always
  # CI never reuses incremental data. This keeps the target directory cache small.
  CARGO_INCREMENTAL: "0"

jobs:
  # ------------------------------------------------------------------ lint ----
  # Format, lint, and typecheck. Clippy compiles libghostty-vt-sys, so this job
  # needs Zig and the Ghostty source, the same as the build jobs.
  lint:
    name: Format, lint, and typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.0

      # Cache 3. The key matches the one in the linux job, so the two jobs
      # share one entry.
      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-Linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-Linux-

      - name: Check the formatting
        run: cargo fmt --all --check

      # `--locked` fails when Cargo.lock does not answer Cargo.toml. This step
      # also unpacks libghostty-vt-sys into the registry, and the next step reads
      # GHOSTTY_COMMIT out of that source. Without this step the next step fails.
      - name: Download the crate sources
        run: cargo fetch --locked

      - name: Verify the pins
        run: cargo xtask verify-pins

      # Read the CAUTION on this step in the linux job.
      - name: Read the pinned Ghostty commit
        run: |
          set -euo pipefail
          cache="${CARGO_HOME:-$HOME/.cargo}/registry/cache"
          crate=$(find "$cache" -name 'libghostty-vt-sys-*.crate' | sort | head -1)
          name=$(basename "$crate" .crate)
          commit=$(tar -xzOf "$crate" "$name/build.rs" \
            | sed -n 's/.*GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)".*/\1/p' | head -1)
          if [ ${#commit} -ne 40 ]; then
            echo "FAILURE: no GHOSTTY_COMMIT in $name/build.rs"
            exit 1
          fi
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ghostty $commit, from $name"

      # Cache 1. This cache holds the Zig global cache, and not the compile
      # output of a target. Read the note at the top of this file.
      - name: Cache the Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/zig-cache
          key: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-

      # Cache 2. The commit is the only input to this checkout, so every job
      # shares one entry.
      - name: Cache the Ghostty source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/ghostty-src
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      - name: Get the Ghostty source
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/.toolchain/ghostty-src"
          if [ ! -f "$dir/build.zig" ]; then
            rm -rf "$dir"
            mkdir -p "$(dirname "$dir")"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ghostty-org/ghostty.git "$dir"
            git -C "$dir" checkout "$GHOSTTY_COMMIT"
          fi
          test -f "$dir/build.zig"
          test "$(git -C "$dir" rev-parse HEAD)" = "$GHOSTTY_COMMIT"
          echo "GHOSTTY_SOURCE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Cache 5. The key matches the one in the e2e and linux jobs.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-Linux-${{ hashFiles('web/bun.lock') }}
          restore-keys: node-modules-Linux-

      - name: Install the dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check the types
        working-directory: web
        run: bun run typecheck

  # ------------------------------------------------------------------- e2e ----
  # The browser suite drives Chromium against a stub server, and the
  # end-to-end suite drives Chromium against one real pirate process. Both need
  # Chromium, and the end-to-end suite also needs the compiled binary, so the
  # two live in one job with Rust, Zig, and Chromium.
  e2e:
    name: Browser and end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.0

      # Cache 3.
      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-Linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-Linux-

      - name: Download the crate sources
        run: cargo fetch --locked

      # Read the CAUTION on this step in the linux job.
      - name: Read the pinned Ghostty commit
        run: |
          set -euo pipefail
          cache="${CARGO_HOME:-$HOME/.cargo}/registry/cache"
          crate=$(find "$cache" -name 'libghostty-vt-sys-*.crate' | sort | head -1)
          name=$(basename "$crate" .crate)
          commit=$(tar -xzOf "$crate" "$name/build.rs" \
            | sed -n 's/.*GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)".*/\1/p' | head -1)
          if [ ${#commit} -ne 40 ]; then
            echo "FAILURE: no GHOSTTY_COMMIT in $name/build.rs"
            exit 1
          fi
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ghostty $commit, from $name"

      # Cache 1.
      - name: Cache the Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/zig-cache
          key: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-

      # Cache 2.
      - name: Cache the Ghostty source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/ghostty-src
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      - name: Get the Ghostty source
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/.toolchain/ghostty-src"
          if [ ! -f "$dir/build.zig" ]; then
            rm -rf "$dir"
            mkdir -p "$(dirname "$dir")"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ghostty-org/ghostty.git "$dir"
            git -C "$dir" checkout "$GHOSTTY_COMMIT"
          fi
          test -f "$dir/build.zig"
          test "$(git -C "$dir" rev-parse HEAD)" = "$GHOSTTY_COMMIT"
          echo "GHOSTTY_SOURCE_DIR=$dir" >> "$GITHUB_ENV"

      # Cache 5.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-Linux-${{ hashFiles('web/bun.lock') }}
          restore-keys: node-modules-Linux-

      # Cache 6. This job is the only writer, because it is the only job that
      # installs a browser.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-Linux-${{ hashFiles('web/bun.lock') }}
          restore-keys: playwright-Linux-

      # Install Chromium only. The tests launch `chromium` and no other browser.
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # `cargo xtask build` builds the web assets, then the host binary. The web
      # build writes web/dist, which the end-to-end suite serves, and
      # `web/e2e/server.ts` starts `target/debug/pirate`.
      - name: Build the web assets and the host binary
        run: cargo xtask build

      - name: Run the browser tests
        working-directory: web
        run: bun run test

      - name: Run the end-to-end suite
        working-directory: web
        run: bun run test:e2e

  # ----------------------------------------------------------------- macos ----
  macos:
    name: Build the Apple targets
    # CAUTION: Do not use `macos-latest`. Zig 0.15.2 cannot link against the
    # macOS 26 SDK, because its libSystem.B.tbd lists `arm64e-macos` and does not
    # list `arm64-macos`. A runner image bump to a macOS 26 SDK therefore breaks
    # the build with no change in this repository. This pin holds the image, and
    # the Xcode step below holds the SDK inside it.
    runs-on: macos-15
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries Xcode 16.4 (SDK 15.5) and Xcode 26.x (SDK 26.x). Zig
      # 0.15.2 needs the 15.x SDK. The SDK scan in xtask skips an unusable SDK,
      # and this step makes the choice explicit and makes a removal loud.
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      # This step installs every tool in mise.toml. It also exports the `[env]`
      # block of that file, so ZIG_GLOBAL_CACHE_DIR reaches every later step.
      - name: Install the pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.0

      # Cache 3.
      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-macOS-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-macOS-

      # `--locked` fails when Cargo.lock does not answer Cargo.toml. The step
      # below reads the Ghostty commit out of the crate that this step downloads.
      - name: Download the crate sources
        run: cargo fetch --locked

      # CAUTION: Read this commit from the crate, and never from
      # toolchain/ghostty.toml. A later step checks out this commit and exports
      # the checkout as GHOSTTY_SOURCE_DIR. The build script of libghostty-vt-sys
      # then builds that tree, and it asserts on build.zig alone. It never
      # compares the tree against its own GHOSTTY_COMMIT constant. A drifted file
      # therefore makes CI build a parser that the release build never builds.
      - name: Read the pinned Ghostty commit
        run: |
          set -euo pipefail
          cache="${CARGO_HOME:-$HOME/.cargo}/registry/cache"
          crate=$(find "$cache" -name 'libghostty-vt-sys-*.crate' | sort | head -1)
          name=$(basename "$crate" .crate)
          commit=$(tar -xzOf "$crate" "$name/build.rs" \
            | sed -n 's/.*GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)".*/\1/p' | head -1)
          if [ ${#commit} -ne 40 ]; then
            echo "FAILURE: no GHOSTTY_COMMIT in $name/build.rs"
            exit 1
          fi
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ghostty $commit, from $name"

      # Cache 1. This cache holds the Zig global cache, and not the compile
      # output of a target. Read the note at the top of this file.
      - name: Cache the Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/zig-cache
          key: zig-global-macOS-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-global-macOS-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-

      # Cache 2. The commit is the only input to this checkout.
      - name: Cache the Ghostty source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/ghostty-src
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      # The build script of libghostty-vt-sys clones with `--filter=blob:none
      # --no-checkout`, then runs `git checkout <commit>`. The result is a work
      # tree that holds build.zig, and build.zig is the only thing the script
      # asserts on. These two commands make the same shape.
      - name: Get the Ghostty source
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/.toolchain/ghostty-src"
          if [ ! -f "$dir/build.zig" ]; then
            rm -rf "$dir"
            mkdir -p "$(dirname "$dir")"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ghostty-org/ghostty.git "$dir"
            git -C "$dir" checkout "$GHOSTTY_COMMIT"
          fi
          test -f "$dir/build.zig"
          test "$(git -C "$dir" rev-parse HEAD)" = "$GHOSTTY_COMMIT"
          echo "GHOSTTY_SOURCE_DIR=$dir" >> "$GITHUB_ENV"

      # Cache 5.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-macOS-${{ hashFiles('web/bun.lock') }}

      # Cache 4. Restore on every run. Save on `main` only, so that one branch
      # cannot fill the 10 GB budget with copies of a multi-gigabyte directory.
      - name: Restore the target directory
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-macOS-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: target-macOS-

      # `cargo xtask build` writes the SDK shim itself, so this job needs no
      # separate setup step.
      - name: Build the Apple targets
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo xtask build --target "$target"
          done

      # The spec asks for this check: the macOS binary links against the system
      # libraries and nothing else.
      - name: Check the macOS link
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            binary="target/$target/debug/pirate"
            file "$binary"
            report=$(otool -L "$binary")
            echo "$report"
            outside=$(printf '%s\n' "$report" | tail -n +2 \
              | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)' || true)
            if [ -n "$outside" ]; then
              echo "FAILURE: $target links against a library outside /usr/lib and /System/Library."
              printf '%s\n' "$outside"
              exit 1
            fi
          done

      # cargo test builds and runs on the host target only, the same as the
      # unit tests in the linux job.
      - name: Run the tests
        run: cargo test --workspace

      - name: Save the target directory
        if: github.event_name == 'push' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-macOS-${{ hashFiles('Cargo.lock', 'mise.toml') }}

  # ----------------------------------------------------------------- linux ----
  linux:
    name: Build the Linux targets
    # Pinned, for the same reason as the macOS job: an image bump must be a
    # change in this file and not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This step installs every tool in mise.toml, which includes cargo-zigbuild
      # for the four Linux targets. It puts each tool on PATH and exports the
      # `[env]` block of that file. The tests run without xtask, and they need
      # both: the build script of libghostty-vt-sys runs `zig` by a bare PATH
      # lookup, and it writes to ZIG_GLOBAL_CACHE_DIR.
      - name: Install the pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.0

      # Cache 3. The key matches the one in the lint and e2e jobs.
      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-Linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-Linux-

      - name: Download the crate sources
        run: cargo fetch --locked

      # CAUTION: Read this commit from the crate, and never from
      # toolchain/ghostty.toml. A later step checks out this commit and exports
      # the checkout as GHOSTTY_SOURCE_DIR. The build script of libghostty-vt-sys
      # then builds that tree, and it asserts on build.zig alone. It never
      # compares the tree against its own GHOSTTY_COMMIT constant. A drifted file
      # therefore makes CI build a parser that the release build never builds.
      - name: Read the pinned Ghostty commit
        run: |
          set -euo pipefail
          cache="${CARGO_HOME:-$HOME/.cargo}/registry/cache"
          crate=$(find "$cache" -name 'libghostty-vt-sys-*.crate' | sort | head -1)
          name=$(basename "$crate" .crate)
          commit=$(tar -xzOf "$crate" "$name/build.rs" \
            | sed -n 's/.*GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)".*/\1/p' | head -1)
          if [ ${#commit} -ne 40 ]; then
            echo "FAILURE: no GHOSTTY_COMMIT in $name/build.rs"
            exit 1
          fi
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ghostty $commit, from $name"

      # Cache 1. This cache holds the Zig global cache, and not the compile
      # output of a target. Read the note at the top of this file.
      - name: Cache the Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/zig-cache
          key: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-global-Linux-${{ hashFiles('mise.toml') }}-${{ env.GHOSTTY_COMMIT }}-

      # Cache 2.
      - name: Cache the Ghostty source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/ghostty-src
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      - name: Get the Ghostty source
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/.toolchain/ghostty-src"
          if [ ! -f "$dir/build.zig" ]; then
            rm -rf "$dir"
            mkdir -p "$(dirname "$dir")"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ghostty-org/ghostty.git "$dir"
            git -C "$dir" checkout "$GHOSTTY_COMMIT"
          fi
          test -f "$dir/build.zig"
          test "$(git -C "$dir" rev-parse HEAD)" = "$GHOSTTY_COMMIT"
          echo "GHOSTTY_SOURCE_DIR=$dir" >> "$GITHUB_ENV"

      # Cache 5.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-Linux-${{ hashFiles('web/bun.lock') }}

      # Cache 4. Read the note in the macOS job.
      - name: Restore the target directory
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-Linux-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: target-Linux-

      - name: Build the Linux targets
        run: |
          set -euo pipefail
          for target in \
            x86_64-unknown-linux-gnu.2.28 \
            aarch64-unknown-linux-gnu.2.28 \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl
          do
            cargo xtask build --target "$target"
          done

      # The glibc floor comes out of the `zig cc` link step. No manifest declares
      # it. This check is the only thing that holds it.
      #
      # readelf --dyn-syms prints the symbol name and the version on one line, so
      # the failure message can name the offending symbol. `readelf -V` prints
      # the versions without the names, and `nm -D` needs a second pass for them.
      - name: Check the glibc floor
        run: |
          set -euo pipefail
          floor=2.28
          status=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            binary="target/$target/debug/pirate"
            symbols=$(readelf --wide --dyn-syms "$binary")
            # Keep `name@GLIBC_x.y` tokens only. The digit class drops
            # GLIBC_PRIVATE, which carries no version to compare.
            refs=$(printf '%s\n' "$symbols" \
              | grep -oE '[^[:space:]]+@@?GLIBC_[0-9]+(\.[0-9]+)+' | sort -u || true)
            if [ -z "$refs" ]; then
              echo "$target: no versioned glibc symbol. Nothing to check."
              continue
            fi
            # sort -V orders version numbers. The last line is the highest.
            highest=$(printf '%s\n' "$refs" | sed 's/.*GLIBC_//' | sort -u -V | tail -1)
            echo "$target: the highest glibc symbol version is $highest"
            # The floor holds when the floor sorts last against the highest.
            if [ "$(printf '%s\n%s\n' "$highest" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              pattern=$(printf '%s' "$highest" | sed 's/\./\\./g')
              echo "FAILURE: $target needs glibc $highest. The floor is $floor."
              printf '%s\n' "$refs" | grep -E "GLIBC_${pattern}\$" \
                | sed 's/^/  offending symbol: /'
              status=1
            fi
          done
          exit $status

      # readelf reads the headers of any architecture. `ldd` reads the host
      # architecture only, and glibc 2.35 changed its word for a static binary
      # from "statically linked" to "not a dynamic executable".
      - name: Check the musl link
        run: |
          set -euo pipefail
          status=0
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            binary="target/$target/debug/pirate"
            file "$binary"
            # A static binary names no dynamic loader and no shared library.
            refs=$(readelf --wide --program-headers --dynamic "$binary" \
              | grep -E 'INTERP|NEEDED' || true)
            if [ -n "$refs" ]; then
              echo "FAILURE: $target is not statically linked."
              printf '%s\n' "$refs" | sed 's/^/  /'
              status=1
            fi
          done
          exit $status

      # No Linux binary has ever run in this project. Architecture and static
      # linkage are proven. Run-time behavior is not.
      - name: Run the musl binary and request the index page
        run: |
          set -euo pipefail
          binary="target/x86_64-unknown-linux-musl/debug/pirate"
          "$binary" --bind 127.0.0.1 --port 8099 &
          pid=$!
          served=0
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8099/"; then
              served=1
              break
            fi
            sleep 0.2
          done
          if [ "$served" -ne 1 ]; then
            echo "FAILURE: pirate did not serve the index page within 10 seconds."
            kill "$pid" || true
            exit 1
          fi
          body=$(curl -fsS "http://127.0.0.1:8099/")
          kill "$pid"
          if ! printf '%s' "$body" | grep -q 'id="terminal"'; then
            echo "FAILURE: the index page has no terminal element."
            printf '%s\n' "$body" | head -20
            exit 1
          fi
          echo "the musl binary served the index page"

      # cargo test builds and runs on the host target only, the same as the
      # unit tests in the macos job.
      - name: Run the tests
        run: cargo test --workspace

      - name: Save the target directory
        if: github.event_name == 'push' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-Linux-${{ hashFiles('Cargo.lock', 'mise.toml') }}
