[workspace]
resolver = "2"
members = ["crates/pirate", "crates/pirate-bench", "crates/xtask"]

# vendor/beamterm is a workspace of its own. It builds for
# wasm32-unknown-unknown only, and it declares edition 2024 with its own lint
# set and its own rustfmt.toml. A member here would put those crates into
# `cargo clippy --workspace --all-targets`, into `cargo test --workspace`, and
# into `cargo fmt --all --check`, and all three run on the host.
exclude = ["vendor/beamterm"]

# The only version number in the repository. `cargo xtask version <x.y.z>`
# writes this value and propagates it to web/package.json.
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/oscarfrasier/pirate"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
